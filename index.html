<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ec826f"><meta name="referrer" content="strict-origin-when-cross-origin">
<title>我们的恋爱日志</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23ec826f'/%3E%3Ctext x='13' y='47' font-size='44' fill='white'%3E♥%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=cloud-1">
<script src="config.js"></script><script defer src="cloud.js"></script><script defer src="app.js?v=cloud-1"></script>
</head>
<body>
<section class="auth-screen" id="authScreen">
  <div class="auth-card"><div class="brand-mark">♥</div><p class="eyebrow">OUR LITTLE UNIVERSE</p><h1>属于我们的<br>小小宇宙。</h1><p class="auth-intro">登录以后，继续写下我们的故事。</p>
  <div class="setup-notice" id="setupNotice" hidden>网站还差最后一步配置：请按压缩包内的《部署指南》创建 Supabase 项目，运行数据库脚本，然后填写 config.js。</div>
  <form id="loginForm"><label>邮箱<input id="loginEmail" type="email" autocomplete="username" placeholder="你的邮箱" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" minlength="8" placeholder="你的登录密码" required></label><button class="write-btn full" id="loginButton" type="submit">进入我们的故事 →</button></form>
  <p class="auth-error" id="authError" role="alert"></p><p class="auth-foot">仅限你们两人的账号访问 · 内容在云端同步</p></div>
</section>
<div class="app" id="app" hidden>
<aside class="sidebar"><div class="brand"><div class="brand-mark" id="brandIcon">♥</div><div><strong id="brandName"></strong><small id="brandSubtitle"></small></div></div>
<nav class="nav" aria-label="主导航"><button class="active" data-section="home"><span class="nav-ico">⌂</span><span id="navHome"></span></button><button data-section="timeline"><span class="nav-ico">◷</span><span id="navTimeline"></span></button><button data-section="gallery"><span class="nav-ico">▣</span><span id="navGallery"></span></button><button data-section="wishes"><span class="nav-ico">♡</span><span id="navWishes"></span></button><button data-section="about"><span class="nav-ico">✦</span><span id="navAbout"></span></button></nav>
<div class="side-foot"><b id="footerTitle"></b><span id="footerText"></span></div></aside>
<main class="main"><div class="topbar"><div class="crumb"><strong id="crumbTitle">故事首页</strong></div><div class="top-actions"><span class="sync-status" id="syncStatus" role="status">正在连接…</span><button class="edit-mode-btn" id="editPage">编辑文案</button><button class="edit-mode-btn" id="accountButton">账号与备份</button></div></div>
<section class="section visible" id="home"><section class="hero"><div class="eyebrow" id="heroEyebrow"></div><h1 id="heroTitle"></h1><p id="heroSubtitle"></p><div class="stats"><div class="stat"><strong id="daysCount">—</strong><span id="daysLabel"></span></div><div class="stat"><strong id="memoryCount">0</strong><span id="memoryLabel"></span></div><div class="stat"><strong id="cityCount"></strong><span id="cityLabel"></span></div></div><div class="hero-heart">♡</div></section>
<div class="grid"><section><div class="section-head"><div><div class="section-title" id="recentTitle"></div><div class="section-sub" id="recentSubtitle"></div></div><button class="write-btn" data-add="log">＋ 写一篇日志</button></div><div class="search-panel" data-search="home"></div><div class="timeline" id="homeTimeline"></div></section>
<aside class="right-col"><div class="card countdown"><div class="card-head"><span class="card-title" id="anniversaryTitle"></span><button class="more" data-setting="anniversary">编辑</button></div><small id="countdownLabel"></small><b><span id="countdownDays">—</span> <small class="inline-day">天</small></b><div class="date" id="anniversaryDate"></div></div><div class="card"><div class="card-head"><span class="card-title" id="memoryTitle"></span><button class="more" data-setting="memory">编辑</button></div><div class="memory-img" id="memoryImage"></div><p class="memory-caption" id="memoryCaption"></p><span class="memory-date" id="memoryDate"></span></div><div class="card mood-card"><div class="card-head"><span class="card-title" id="moodTitle"></span><span class="muted" id="todayDate"></span></div><div class="mood-row" id="moodRow"></div><p class="mood-note muted" id="moodNote"></p></div></aside></div></section>
<section class="section" id="timeline"><div class="section-head"><div><div class="section-title" id="timelineTitle"></div><div class="section-sub" id="timelineSubtitle"></div></div><button class="write-btn" data-add="log">＋ 写一篇日志</button></div><div class="search-panel" data-search="timeline"></div><div class="timeline" id="timelineList"></div></section>
<section class="section" id="gallery"><div class="section-head"><div><div class="section-title" id="galleryTitle"></div><div class="section-sub" id="gallerySubtitle"></div></div><button class="write-btn" data-add="photo">＋ 添加照片</button></div><div class="gallery-grid" id="galleryGrid"></div></section>
<section class="section" id="wishes"><div class="section-head"><div><div class="section-title" id="wishesTitle"></div><div class="section-sub" id="wishesSubtitle"></div></div><button class="write-btn" data-add="wish">＋ 添加愿望</button></div><div class="wish-grid" id="wishGrid"></div></section>
<section class="section" id="about"><div class="about-card"><h2 id="aboutTitle"></h2><p id="aboutText"></p><div class="about-list" id="aboutList"></div><button class="write-btn" data-setting="about">编辑我们的故事</button></div></section>
</main></div>
<dialog id="editor"><form id="editorForm"><div class="modal-head"><h2 id="editorTitle"></h2><button type="button" class="close" id="closeEditor" aria-label="关闭">×</button></div><div id="editorFields"></div><p id="editorError" class="auth-error" role="alert"></p><div class="save-row"><button type="button" class="cancel" id="cancelEditor">取消</button><button type="submit" class="save" id="saveEditor">保存并同步</button></div></form></dialog>
<dialog id="accountDialog"><div class="modal-head"><h2>账号与备份</h2><button class="close" data-close="accountDialog" aria-label="关闭">×</button></div><p class="muted" id="accountEmail"></p><p class="muted">双方登录后共享同一份记录。保存成功后，另一台设备约 8 秒可看到更新。</p><div class="account-actions"><button class="write-btn" id="refreshButton">立即同步</button><button class="cancel" id="exportButton">导出云端备份</button><label class="cancel" for="importFile">导入旧版日志 / 备份</label><input type="file" id="importFile" accept="application/json" hidden><button class="cancel" id="migrateButton">导入此浏览器旧版内容</button><button class="cancel" id="passwordButton">修改我的密码</button><button class="cancel" id="logoutButton">退出登录</button></div><p class="muted" id="importStatus" role="status"></p></dialog>
<div class="toast" id="toast" role="status"></div>
</body></html>
